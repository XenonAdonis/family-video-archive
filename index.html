---
layout: default
title: "Home"
---

{% assign sorted_posts = site.posts | sort: 'date' | reverse %}

{% for post in sorted_posts %}

  <div class="video-post">
    <h2 class="video-title">{{ post.title }}</h2>
    <span class="post-meta">Posted on: {{ post.date | date: "%B %-d, %Y" }}</span>

    {{ post.content }}

  </div>

{% endfor %}
