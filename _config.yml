title: "The Family Video Archive" 
email: your-email@example.com
description: "A curated collection of videos for the whole family to enjoy."
destination: ./public

# Deployment Settings for Vercel (CRITICAL FIXES)
# baseurl MUST be an empty string "" with NO spaces inside the quotes.
# This ensures Jekyll builds the site paths starting from the root directory (/),
# preventing the 404: NOT_FOUND error.
baseurl: ""
url: "" 

# Build settings
markdown: kramdown
theme: minima

# Exclude files used by Jekyll's local setup but not needed for Vercel deployment
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules # If you ever install Node packages